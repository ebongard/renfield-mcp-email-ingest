# Copy to secret.yaml and fill in real values (do NOT commit the filled version).
#   kubectl -n renfield create secret generic renfield-mcp-email-ingest-secrets \
#     --from-literal=RENFIELD_INGEST_TOKEN=... \
#     --from-literal=BUCHHALTUNG_IMAP_USER=... \
#     --from-literal=BUCHHALTUNG_IMAP_PASS=...
apiVersion: v1
kind: Secret
metadata:
  name: renfield-mcp-email-ingest-secrets
  namespace: renfield
type: Opaque
stringData:
  # The email-ingest Bearer token, minted via
  # POST /api/email-ingest/token on the Renfield backend (admin). NOTE: this is
  # a SEPARATE token from the folder-ingest one, so the two watchers are
  # independently revocable.
  RENFIELD_INGEST_TOKEN: "REPLACE_ME"
  # IMAP credentials referenced by name from mailboxes.yaml.
  BUCHHALTUNG_IMAP_USER: "REPLACE_ME"
  BUCHHALTUNG_IMAP_PASS: "REPLACE_ME"
